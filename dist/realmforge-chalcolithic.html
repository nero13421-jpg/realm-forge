<title>RealmForge Chalcolithic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Layout: an excavation record. Ledger header, tab strip, one working view. Hex survey map beside bone-coloured find tags. */
:root{
  color-scheme:dark;
  --ground:#17140f; --ground-2:#211c15; --line:#3b3327;
  --bone:#e8dec6; --bone-ink:#2b2318; --bone-dim:#7d705a;
  --ochre:#d29a3a; --oxide:#d4694a; --verd:#7dbaa5; --muted:#a99d84;
  --t-wood:#3f6b3f; --t-swamp:#456b66; --t-pond:#3f78a0; --t-field:#9db25a; --t-cult:#b88f3d; --t-past:#7fa04a; --t-empty:#221d15;
  --f-display:'Zilla Slab',Georgia,serif;
  --f-body:'Public Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:2.1rem;line-height:1}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
p{margin:0}
.dim{color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:16px}
.sub{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ledger{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0}
.ledger dt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ledger dd{margin:0;font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ledger dd.bad{color:var(--oxide)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:transparent;border:1px solid var(--bone-dim);color:var(--bone);padding:8px 14px;border-radius:2px;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--bone)}
.btn.sm{padding:4px 8px;font-size:.68rem}
.btn.on{background:var(--bone);color:var(--bone-ink);border-color:var(--bone)}
.btn.go{background:var(--ochre);color:#1d1508;border-color:var(--ochre);font-weight:500}
.btn[disabled]{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.panel{background:var(--ground-2);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.note{font-size:.85rem;color:var(--muted);max-width:68ch}
.msg{font-family:var(--f-mono);font-size:.8rem;color:var(--ochre);min-height:1.2em}
.msg.bad{color:var(--oxide)}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text]{width:100%;background:var(--ground);color:var(--bone);border:1px solid var(--bone-dim);border-radius:2px;padding:7px 8px;font:inherit;font-size:.88rem;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
td,th{text-align:left;padding:5px 8px;border-top:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.mono{font-family:var(--f-mono)}

/* find tags */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tag{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--bone);color:var(--bone-ink);border:0;padding:13px 11px 10px;min-height:92px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);min-width:0}
.tag::after{content:"";position:absolute;top:6px;right:18px;width:6px;height:6px;border-radius:50%;background:var(--ground)}
.tag .cat{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--bone-dim)}
.tag .nm{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.15}
.tag .cnt{font-family:var(--f-mono);font-weight:700;font-size:.9rem;white-space:nowrap}
.tag .made{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;color:#7a5a2e}
.tag .st{font-family:var(--f-mono);font-size:.68rem}
.tag .mid{display:flex;gap:8px;align-items:center;min-width:0}
.ic{flex:0 0 auto;display:block;image-rendering:pixelated}
.portrait{display:flex;justify-content:center;background:var(--ground);border:1px solid var(--line);padding:10px}
button.tag:hover{background:#f3ead3}
.tag.sel{box-shadow:inset 0 0 0 3px var(--ochre)}
.tag.fresh{animation:drop .4s ease both}
@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.tag.fresh{animation:none}}

/* hex map */
.hexmap{width:100%;max-width:680px;height:auto;display:block}
.hx{cursor:pointer;stroke:#0f0c08;stroke-width:1.5}
.hx:hover{stroke:var(--bone)}
.h-empty{fill:var(--t-empty)}
.hx.h-clear{fill:transparent;stroke:transparent}.hx.h-clear:hover{stroke:rgba(244,234,210,.55);stroke-width:1.2}
.h-woodland{fill:url(#pt-woodland)}.h-swamp{fill:url(#pt-swamp)}.h-pond{fill:url(#pt-pond)}
.h-field{fill:url(#pt-field)}.h-cultivated{fill:url(#pt-cultivated)}.h-pasture{fill:url(#pt-pasture)}
.h-set{fill:url(#pt-settle)}
.hl.setlab{font-size:9px;fill:var(--bone);stroke:#14100a;stroke-width:2.5;paint-order:stroke}
.hl{font-family:var(--f-mono);font-size:11px;fill:#14100a;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.camp{font-family:var(--f-display);font-weight:700;font-size:17px;fill:#fff;stroke:#7b2f1c;stroke-width:3;paint-order:stroke;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.camp.done{fill:#9d917a;stroke:none;opacity:.8}
.route{fill:none;stroke:var(--ochre);stroke-width:4;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pal{fill:none;stroke:#7b3a22;stroke-width:4;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

/* match */
.hexmap.world{max-width:none}
.mapscroll{overflow-x:auto;border:1px solid var(--line);background:var(--ground)}
.mine-ring{fill:none;stroke:var(--ochre);stroke-width:2.5;pointer-events:none}
.sel-ring{fill:none;stroke:var(--bone);stroke-width:3.5;pointer-events:none}
.camp.roam{fill:#ffe9a8;stroke:#a3281c}
.cnt{font-family:var(--f-mono);font-size:9px;fill:var(--bone);stroke:#14100a;stroke-width:2.5;paint-order:stroke;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.facts li{border-left:3px solid var(--ochre);padding-left:8px}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.compass .btn{padding:6px 4px;text-align:center;line-height:1.25;text-transform:none}
.compass .mid-lab{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);color:var(--ochre)}

#view{display:flex;flex-direction:column;gap:20px}
/* animation */
.pbview{background:var(--ground);border:1px solid var(--line);display:flex;justify-content:center;min-height:120px;overflow:hidden}
.strip{width:100%;height:auto;display:block}
.lB{opacity:0}
.walk .lA{animation:legA .36s steps(1) infinite}
.walk .lB{animation:legB .36s steps(1) infinite}
.walk .bob,.mk.roam .bob{animation:bob .36s steps(1) infinite}
.mk.roam .lA{animation:legA .36s steps(1) infinite}.mk.roam .lB{animation:legB .36s steps(1) infinite}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.lw{transition:transform .1s}
.lw.lungeR{transform:translateX(6px)}.lw.lungeL{transform:translateX(-6px)}
.bob.hit{filter:brightness(2.6) saturate(0)}
.ent .bob{transform-box:fill-box;transform-origin:center}
.ent.dead .bob{transform:rotate(90deg) translateX(8px);opacity:.55;filter:grayscale(1);animation:none}
.ent.dead .hpb,.ent.dead .hpbg{display:none}
.ent.gone{opacity:0;transition:opacity .4s}
.hpbg{fill:#2a2018}.hpb{fill:var(--verd)}.side-e .hpb{fill:var(--oxide)}
.fx-arrow{stroke:#e8dec6;stroke-width:2}
.fx-jab{fill:#ff6a4a;stroke:#ffd0c0;stroke-width:1.5}
.fx-slash{fill:#b07cff;stroke:#e6d6ff;stroke-width:1.5}
.fx-bolt{fill:#ffd24a;stroke:#fff3c0;stroke-width:2}
.bstat{display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.bfwrap{background:var(--ground);border:1px solid var(--line);overflow:hidden}
.bfield{width:100%;height:auto;display:block;touch-action:manipulation}
.pbview .bfield{max-width:100%}
.bfe .bob{transform-box:fill-box;transform-origin:50% 100%;transition:transform .45s ease-in,opacity .45s}.bfe.dead .bob{opacity:.9;filter:grayscale(.55) brightness(.8);animation:none}.pa1,.pa2,.pc,.pg,.pd{display:none}.bfe.atk .lA,.bfe.atk .lB,.bfe.cst .lA,.bfe.cst .lB,.bfe.guard .lA,.bfe.guard .lB,.bfe.dead .lA,.bfe.dead .lB{display:none}.bfe.atk .pa1{display:inline;animation:pfa var(--pd,320ms) steps(1) forwards}.bfe.atk .pa2{display:inline;opacity:0;animation:pfb var(--pd,320ms) steps(1) forwards}@keyframes pfa{0%{opacity:1}42%{opacity:0}100%{opacity:0}}@keyframes pfb{0%{opacity:0}42%{opacity:1}100%{opacity:1}}.bfe.cst .pc{display:inline}.bfe.guard:not(.atk):not(.cst):not(.dead) .pg{display:inline}.bfe.dead .pd{display:inline}.bfe.dead.atk .pa1,.bfe.dead.atk .pa2,.bfe.dead .pg,.bfe.dead .pc{display:none}.fx-dust{fill:#cbb88a;opacity:.6}.fx-blood{fill:#8a1a14}.bfe .gsh{display:none}.bfe.guard .gsh{display:inline}.bfe.dead .hpb,.bfe.dead .hpbg{display:none}.bfe.dead .bfr{opacity:.3}
.bfe.gone{display:none}.bfe.sel .bfr{stroke:#fff;stroke-width:.18}
.bfe.walk .lA{animation:legA .36s steps(1) infinite}.bfe.walk .lB{animation:legB .36s steps(1) infinite}
.bfdz{fill:rgba(240,198,78,.07);stroke:rgba(240,198,78,.55);stroke-width:.4;stroke-dasharray:2 1.5}
.bflab{font:600 3px var(--f-mono);fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:.6}
.bfarrow{stroke:#f4ead2;stroke-width:.2}
.fx-thrust{stroke:#f4ead2;stroke-width:.22;stroke-linecap:round}
.fx-swing{fill:none;stroke:#fff6dc;stroke-width:.28;stroke-linecap:round}.fx-swing.big{stroke-width:.42;stroke:#ffe7a8}
.fx-stab{fill:#fff6dc}.fx-claw{stroke:#ff7a5c;stroke-width:.14;stroke-linecap:round}
.fx-bolt{fill:#c9b6ff;filter:drop-shadow(0 0 1.2px #8e6cff)}
.fx-arcarrow{stroke:#9fe3ff;stroke-width:.28;stroke-linecap:round;filter:drop-shadow(0 0 1px #5fc4ff)}
.fx-burst{fill:none;stroke:#9fe3ff;stroke-width:.28;transform-box:fill-box;transform-origin:center}.fx-burst.bolt{stroke:#c9b6ff;stroke-width:.4}
.fx-slash{fill:none;stroke:#9fe3ff;stroke-width:.3;stroke-linecap:round;stroke-dasharray:5}
.fx-wave{fill:none;stroke:#bfe9ff;stroke-width:.35;transform-box:fill-box;transform-origin:center}
.fx-tether{stroke:#b9a2ff;stroke-width:.22;stroke-dasharray:.6 .35}
.fx-shield{fill:#7fd6ff22;stroke:#9fe3ff;stroke-width:.2;transform-box:fill-box;transform-origin:center}
.bfe .shr{fill:#7fd6ff1a;stroke:#9fe3ff;stroke-width:.14;display:none}.bfe.shd .shr{display:inline}
.bpop{font:700 2.6px var(--f-mono);text-anchor:middle;paint-order:stroke;stroke:#140f0a;stroke-width:.45;fill:#ffd36a;animation:bpop 1.2s ease-out forwards}
.bpop.p{fill:#ff8a74}.bpop.miss{fill:#cfc6b4;font-size:2px;font-weight:500}
@keyframes bpop{from{transform:translateY(0);opacity:1}to{transform:translateY(-6px);opacity:0}}
.bgrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(210px,1fr);grid-template-areas:'f d' 'l d';grid-template-rows:auto 1fr;gap:8px 12px;align-items:start}.bdock .bspd .clock{margin-right:4px}.bmain{grid-area:f}.bdock{grid-area:d}.bleg{grid-area:l;min-width:0}
.bmain{min-width:0;display:flex;flex-direction:column;gap:6px}
.bdock{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:var(--ground);border:1px solid var(--line);padding:10px;min-width:0;font-size:.85rem}
.bdock .note{font-size:.74rem}.bdock .msg{font-size:.78rem}.bdock .bsq.fobs{margin:0 0 4px 0}.bdock .bsqs{margin:0}.bdock .bspd{gap:4px;flex-wrap:nowrap}.bdock .bspd .btn{flex:1 1 0;padding:5px 0;text-align:center}.bdock .bstat{border-top:1px solid var(--line);padding-top:6px;font-size:.76rem}.bdock .bsq>.btn{flex:1 1 100%;text-align:left}
@media(max-width:820px){.bgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:'f' 'd' 'l'}.bdock{position:sticky;top:auto;bottom:0;max-height:45vh;z-index:5;box-shadow:0 -6px 16px #0008;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}}
.cambar{gap:4px;align-items:center}.cambar .label{margin-right:4px}
.fold{display:flex;flex-direction:column;gap:10px;min-width:0}
.foldh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:2px 0 6px;color:var(--bone);text-align:left}
.foldh:hover{border-bottom-color:var(--bone-dim)}.foldh h2,.foldh h3{margin:0}.foldh i{font-style:normal;font-family:var(--f-mono);color:var(--muted)}
.fold.shut .foldh{border-bottom-color:transparent;padding-bottom:0}
.foldall{justify-content:flex-end;gap:10px;align-items:center}
.lookhd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bsqs{display:flex;flex-direction:column;gap:6px;margin:8px 0}.bsq{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbtn i,.glegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid #0006}
.glegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-top:6px}.glegend i{border-radius:2px}.glegend b{color:var(--bone);font-weight:600}
.fmwrap{overflow-x:auto}
.rwrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.rmapbox{flex:0 1 300px;min-width:0}.rmap{width:100%;max-width:300px;height:auto;display:block;border:1px solid var(--line)}
.rgrid{fill:none;stroke:#3b3327;stroke-width:.4%}.rfront{stroke:#a99d84;stroke-width:.6%}.rtx{font-family:var(--f-mono);fill:#a99d84;text-anchor:middle}
.rleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.85rem;flex:1 1 180px;min-width:0}.rleg i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid;margin-right:6px;vertical-align:-2px}.fmgrid{width:100%;max-width:520px;height:auto;display:block;touch-action:manipulation}
.fmc{fill:#221d15;stroke:#3b3327;stroke-width:.5}.fmc.anc{fill:#3a2f1c;stroke:var(--ochre)}.fmsel{fill:none;stroke:#fff;stroke-width:2}
.fmfront{font:500 9px var(--f-mono);fill:var(--muted);text-anchor:middle;letter-spacing:.06em}.fmst{font:700 8px var(--f-mono);fill:#ffd36a;text-anchor:end;paint-order:stroke;stroke:#000;stroke-width:2}
.fmchips{gap:6px}.bsq.fobs{margin:-2px 0 6px 14px}
.sheet th{text-align:left;padding-top:10px}.sheet td:first-child{width:55%}
.unit.umin{padding-block:10px}.unit.umin .row{align-items:center}
.sortf{max-width:220px;margin:4px 0 8px}
.tut{border-color:var(--ochre);background:var(--ground-2)}.tut h2{margin:6px 0 4px}.tutd p,.tutd ol,.tutd ul{margin:0 0 8px;max-width:70ch}.tutd ol,.tutd ul{padding-left:20px}
.tutbar{height:4px;background:var(--line);margin:6px 0 4px}.tutbar i{display:block;height:100%;background:var(--ochre)}.tutgoal{color:var(--ochre)}
.btn.tuthint{border-color:var(--ochre);box-shadow:0 0 0 2px var(--ochre);animation:tutp 1.4s ease-in-out infinite}@keyframes tutp{50%{box-shadow:0 0 0 4px rgba(210,154,58,.35)}}
@media(prefers-reduced-motion:reduce){.btn.tuthint{animation:none}}
.zone.team{border:1px dashed var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fx-shield{fill:none;stroke:#7fc8ff;stroke-width:3;opacity:.85}
@media(prefers-reduced-motion:reduce){.walk .lA,.walk .lB,.walk .bob,.mk.roam .bob,.mk.roam .lA,.mk.roam .lB{animation:none}.lw{transition:none}}

.mkbg{fill:#17140f;opacity:.8;stroke:#a3281c;stroke-width:1.5}
.mk.roam .mkbg{stroke:#ffd27a;stroke-width:2}
.info summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.info summary::before{content:'+';font-family:var(--f-mono);color:var(--ochre);width:1ch}
.info[open] summary::before{content:'−'}
.info summary::-webkit-details-marker{display:none}
.info>*+*{margin-top:12px}
.ico{display:inline-flex;align-items:center;gap:8px}
.info td{vertical-align:middle}
.ln{fill:none;pointer-events:none;stroke-linecap:round;stroke-linejoin:round}
.road-o{stroke:#4a3f30;stroke-width:5}.road-i{stroke:#c9bda0;stroke-width:3;stroke-dasharray:2 2}
.stream-o{stroke:#1f4f78;stroke-width:3.5}.stream-i{stroke:#6fb4e8;stroke-width:1.8}.creek-o{stroke:#1f4f78;stroke-width:7}.creek-i{stroke:#6fb4e8;stroke-width:4.2}.draw-creek{stroke:var(--ochre);stroke-width:4;stroke-dasharray:5 4}.wprob{fill:#2a6fa8;stroke:#f4ead2;stroke-width:1.2;vector-effect:non-scaling-stroke}.wprobt{fill:#f4ead2;font-size:9px;font-weight:700;text-anchor:middle;pointer-events:none}
.hexmap text{pointer-events:none}
.hexmap image.terr{image-rendering:pixelated;image-rendering:crisp-edges}
/* one map: drag, wheel or pinch; tap a tile to zoom in right there */
.pz{position:relative;height:min(74vh,760px);min-height:320px;overflow:hidden;background:var(--ground);border:1px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}

.pzctl{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;gap:4px}
.pzctl .btn{min-width:36px;background:var(--ground-2)}
.pzpop{position:absolute;z-index:5;left:8px;top:8px;width:min(300px,calc(100% - 16px));background:var(--ground-2);border:1px solid var(--line);padding:10px;box-shadow:0 8px 24px #000a;cursor:auto;font-size:.85rem;display:flex;flex-direction:column;gap:6px}
.pzpop .facts{margin:0;padding-left:16px}.pzpop .note{margin:0}
.pzpop .pzhd{display:flex;justify-content:space-between;align-items:center;gap:8px}

function tbl(head,rows){return '<div class="tblwrap"><table><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i?' class="mono"':'')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function sec(id,title,body,open){return '<details class="panel info"'+(open?' open':'')+' id="i-'+id+'"><summary><h3>'+title+'</h3></summary>'+body+'</details>'}
function icoWrap(inner,vb,sz){return '<svg class="ic" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+vb+' '+vb+'" shape-rendering="crispEdges" aria-hidden="true">'+inner+'</svg>'}
function icoTerr(k){var d=DITHER[k],sp=SPR[k];return icoWrap('<rect width="12" height="12" fill="'+d[0]+'"/>'+rects(sp,0,0),12,30)}
function icoParch(k){return svgWrap(rects(ART.parch,0,0)+(k&&spArt(k)?rects(spArt(k),3,-3):''),30)}
function icoGround(k){var fl=GFILL[k]||OPEN.field;return '<svg class="ico" viewBox="0 0 12 12" width="30" height="30" aria-hidden="true"><rect width="12" height="12" fill="'+fl[0]+'"/><rect x="2" y="3" width="3" height="2" fill="'+fl[1]+'"/><rect x="7" y="7" width="3" height="2" fill="'+fl[1]+'"/></svg>'}
function icoLine(k){var o='<svg class="ico" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><rect width="24" height="24" fill="#6a8a4e"/>';
  if(k==='road')o+='<path d="M2 20 L10 12 L22 6" stroke="#4a3f30" stroke-width="6" fill="none"/><path d="M2 20 L10 12 L22 6" stroke="#b8a27a" stroke-width="3.4" fill="none"/>';
  else o+='<path d="M2 18 Q8 8 13 13 T22 5" stroke="#2d6c9a" stroke-width="4.6" fill="none"/><path d="M2 18 Q8 8 13 13 T22 5" stroke="#6fb4e8" stroke-width="2.6" fill="none"/>';
  if(k==='bridge')o+='<g transform="translate(12 11) rotate(-35)"><rect x="-3" y="-7" width="6" height="14" fill="#8a6338" stroke="#2a1c0e"/><line x1="-3" y1="-2" x2="3" y2="-2" stroke="#5a3f22"/><line x1="-3" y1="2" x2="3" y2="2" stroke="#5a3f22"/></g>';
  return o+'</svg>'}
function icoArt(k){var a=ART[k]||ART[wkey(k)]||ART[{leather_armor:'hide_armor',leather_greaves:'hide_armor',leather_helmet:'hide_helmet',oak_helmet:'hide_helmet',leather_shield:'hide_shield',oak_shield:'hide_shield'}[k]];if(!a)return '';var m=wmat(k),f=(m.hd==='cu'?'sepia(1) saturate(3) hue-rotate(-12deg)':'')+(m.wd==='pine'&&WEAP[wkey(k)]?' brightness(1.18)':'')+(/^leather_/.test(k)?' brightness(.8) saturate(1.3)':/^oak_/.test(k)?' sepia(.6) brightness(.9)':'');return '<span style="display:inline-block;filter:'+f+'">'+svgWrap(rects(a,0,0),30)+'</span>'}
function icoMob(kind,b){return icoWrap(mobInner(kind,b),16,34)}
function icoMan(eq){return icoWrap(humanInner(eq||[]),16,34)}
function icoSet(k){return icoWrap('<rect width="12" height="12" fill="'+DITHER.settle[0]+'"/>'+rects(SPR['set_'+k],0,0),12,30)}
function spArt(k){return ART16['sp_'+String(k).replace(/^p_/,'')]}
function icoSpell(k,sz){var a=spArt(k);return a?svgWrap(rects(a,0,0),sz||30):''}
function nm(ico,t){return '<span class="ico">'+ico+'<span>'+t+'</span></span>'}
function vInfo(){
  var tw=0;Object.keys(TERR_W).forEach(function(k){tw+=TERR_W[k]});
  var pw=0;PACK.forEach(function(p){pw+=p[1]});
  var KN={human:'Human (male)',terrain:'Terrain',setcard:'Settlement card',weapon:'Weapon or arrows',armor:'Hide armor',helmet:'Hide helmet',shield:'Hide shield',mat:'Material (lumber, gravel)',crystal:'Red crystal',gnosis:'Gnosis',parch:'Spell parchment'};
  var o='<section class="panel"><h2>Info</h2><p class="note">Every rule and number the beta uses, read straight from the game\'s own tables. Numbers marked placeholder are stand-ins until you set them.</p></section>';
  o+=sec('flow','How a game goes',
    '<ol class="osum"><li>Open packs. Gear, materials, crystals, gnosis and parchments go to your shared stockpile. Terrain and settlement cards wait in your hand. Men get assigned to a settlement.</li><li>Place terrain and settlements in the Realm tab. Every tile after the first must touch one you already have. When your realm fills half the map, the map zooms out so your realm is about a tenth of it again. Placement is permanent and the prestige is spent.</li><li>Name and equip your men in Settlements. Each equip costs 1 prestige.</li><li>Form units in Units, station them at settlements and give them orders on the Patrol route tab.</li><li>Set up saved patrols in Patrols and give each unit a default patrol. Start a match: it runs live. Clear every mob to win. When it ends, your realm comes back as it was before.</li></ol>'+
    '<p class="note">You start with 3,500 prestige, 5 packs, 10 of each terrain card, 3 settlement cards and 15 human males.</p>',true);
  o+=sec('terrain','Terrain',tbl(['Terrain','Cost','People fed per hex','Travel speed','Share of terrain pulls'],Object.keys(TERR).map(function(k){var t=TERR[k];return[nm(icoTerr(k),t.n),t.cost,t.ppl,t.sp?'×'+t.sp:'blocks the way',Math.round(TERR_W[k]/tw*100)+'%']}))+
    '<p class="note">A hex is about '+HEX_YD+' yards across. Ponds cannot touch each other. Pasture is raising sheep. Terrain is never destroyed.</p>');
  o+=sec('mats','Materials and gear (Chalcolithic)','<p class="note">Every weapon is a head and a handle: flint or copper on oak or pine. Clubs and bows are all wood.</p>'+
    tbl(['Head','Damage','Best against','Wear per fight','Never below'],[['Flint stone','as listed','×1.25 vs beasts and goblins','−15%','40%'],['Copper','+15%','×1.25 vs men (brigands)','−5%','60%']])+
    '<ul class="facts"><li>Wear comes from use: a weapon loses its wear step for every fight it is used in, plus another for every 300 damage it deals. Arrows wear as a stack.</li><li>Nothing breaks, and every match starts with fresh, sharp gear: wear only makes the later fights of a match harder. Knapping and smithing will restore edges later.</li><li>Pine handles are 15% lighter than oak.</li></ul>'+
    tbl(['Armor','Slot','Stops per hit','Dodge','Weight'],Object.keys(ARM).map(function(k){return[CD[k].n,KIND[CD[k].k],ARM[k].def,ARM[k].dodge?'+'+ARM[k].dodge+'%':'',ARM[k].wt+' lb']}))+
    '<ul class="facts"><li>Pine woodland and pine forest are easier to move through than oak (×0.85 and ×0.7 against ×0.7 and ×0.5) but give less cover: arrows into a pine stand hit ×0.8 instead of ×0.5, and a hidden man is seen from 14 yd instead of 8.</li></ul>')+
  sec('elev','Elevation (Chalcolithic)',tbl(['Card','Shape','Rise','Extra cost'],Object.keys(ELEV).map(function(e){var E2=ELEV[e];return[E2.n+' · field, woodland or forest',E2.sh==='slope'?'Rises across the tile toward the side you turn it to':'Rises in the middle, edges stay level',E2.rise+' m',E2.cost+' prestige on top of the terrain']}))+
    '<ul class="facts"><li>A tile is about 340 m across, so a gentle slope is about a 7% grade and a moderate one about 15%.</li><li>Heights carry forward: a new tile starts at the height its placed neighbours hand it. Past a slope\'s high edge the land stays up (a plateau). A slope dropped between level tiles climbs to a crest and falls away into the far neighbour as a bank.</li><li>Banks are where heights meet. They feather over about 80 m, so a 25 m drop is a moderate scramble and a 50 m drop a hard one.</li></ul>'+
    tbl(['Grade','How men move'],[['up to 20%','Creep, walk, jog or sprint. Uphill is slower (×0.55 at worst), downhill a little faster.'],['20 to 50%','Moderate scramble: about '+SCR_MOD+' yd/s at most, as tiring as jogging.'],['50 to 100%','Hard scramble on all fours: about '+SCR_HARD+' yd/s at most, as tiring as sprinting.'],['over 100%','Only a jump or a climb gets you up. Nobody has those skills yet, so patrol lines cannot be drawn up it.']])+
    '<ul class="facts"><li>High ground: an archer above his target hits up to 20% more often (1% per metre); below, up to 20% less. In melee the man above gets up to +8 skill.</li></ul>')+
  sec('water','Water (Chalcolithic)','<ul class="facts"><li>Water only runs downhill; level ground is fine.</li><li>A stream starts anywhere and must end in a body of water: a pond, swamp, small open water or a creek.</li><li>A creek is twice a stream\'s width. It must start in a body of water and end in another.</li><li>Ponds never touch ponds. Small open water can touch other water, but needs water flowing in: a stream or creek ending in it, or a pond or swamp beside it at its level or higher.</li><li>A pond, swamp or open water standing above the land next to it needs an outlet: a stream or creek running out of it.</li><li>Cultivated fields need water within two tiles: a pond, swamp, small open water, stream or creek, with its rules met. Water with a rule unmet shows a blue ! on the map and does not count until fixed.</li></ul>')+
  sec('lines','Roads and streams',tbl(['Feature','Cost','Effect'],[[nm(icoLine('road'),'Gravel road'),lineCostText('road'),'Travel speed ×'+ROAD_SP+' on every tile it crosses, for mobs and for any unit marching in a file (one column). Every patrol route leans toward roads. Name your roads in the Realm tab. A unit in any wider order of movement walks it at the normal speed of the ground underneath.'],[nm(icoLine('stream'),'Stream'),lineCostText('stream'),'Crossing it takes 2 minutes per unit, mobs too. A stream that reaches a pond ends in it.'],[nm(icoLine('bridge'),'Footbridge'),BRIDGE_COST+' prestige + '+matsText(BRIDGE_MATS),'Placed on a tile a stream runs through. Units cross single file: '+BRIDGE_FILE_S+' seconds for a unit already marching in a file, '+(BRIDGE_FILE_S+BRIDGE_REFORM_S)+' seconds for any other order of movement, which files over and re-forms on the far side. Mobs use it too ('+BRIDGE_MOB_S+' s). On the battlefield it is a one-man-wide plank path over the water.']])+'<p class="note">Gravel and lumber come from your stockpile. Lay them point by point in the Realm tab. They run straight from click to click and ignore tile edges, so you can zigzag them however you like. Ponds still block the way, road or not.</p>');
  o+=sec('settle','Settlements',tbl(['Settlement','Cost','Settlement cards','Hexes','People needed','Palisades','Armed personnel'],Object.keys(SETT).map(function(k){var d=SETT[k];return[nm(icoSet(k),d.n),d.cost+' prestige'+(d.mats?' + '+matsText(d.mats):''),d.cards,d.hexes||1,d.need+' (placeholder)','up to '+d.maxPal,d.def?'up to '+d.def:'not set']}))+
    '<p class="note">Settlements cannot touch each other: leave at least one tile between them. Your terrain has to feed every settlement, or you cannot place a new one. A military camp needs a wilderness of '+CAMP_WILD+' connected wild tiles placed in your realm: woodland, swamp and field you can walk through without crossing farmland, pasture or a settlement. Ponds do not count. Fort works: you draw palisades like roads. A small palisade (6 ft) costs '+PALS.s.cost+' prestige and '+PAL_TIM+' small timber; a large one (10 ft) '+PALS.l.cost+' prestige and '+PAL_TIM+' large timber. Either buys '+PAL_M+' m of wall, one tight loop round a hamlet\'s 2.5 ha core, drawn in one go in as many pieces as you like; what you don\'t draw is lost. Labor: 1 man per '+PAL_LAB_M+' m drawn. A panel (one timber, about 1.9 m) takes '+PALS.s.hp+' HP (small) or '+PALS.l.hp+' HP (large) to break. Claws and spears bite logs poorly (goblins ×'+WALLX.goblin+', brigands ×'+WALLX.brigand+' of a blow), so a goblin band needs about 30 s for a small panel or gate and about a minute for a large one. Only a jump of 6 ft or 10 ft clears it. Your men behind a wall take arrows ×'+COVER+'. A gate ('+GATE.cost+' prestige, '+GATE.tim+' timber of the wall\'s size, 1 small gravel, 1 man) replaces two panels, opens by itself for your men and stays shut to enemies. A watchtower ('+workText(towerCost())+') holds 4 men 15 ft up: +20% bow range and hit chance, out of melee reach. Smart enemies (goblins, brigands) go for a gate they can see, or walk the wall looking for one, and break a panel only when they find none. Dumb ones hit the nearest panel. Where a stream or creek drops steeper than 45% it becomes a waterfall. Land use: villages need 8 firewood (oak forest 1.5 a tile, oak woodland 1, pine 0.75, swamp peat 0.5) and 3 specialty food tiles (orchards for now); camps need 2 firewood; every pasture needs half a prairie (one field feeds two pastures). All of it within an hour\'s walk, and each tile serves only one. Hamlets need nothing extra. A hamlet\'s 8 longhouses (about 20 people each) can be dragged about its core and tapped to turn.</p>');
  o+=sec('packs','Packs',tbl(['Card type','Chance per card'],PACK.map(function(p){return[nm({human:icoMan([]),terrain:icoTerr('woodland'),weapon:icoArt('spear'),armor:icoArt('hide_armor'),shield:icoArt('hide_shield'),helmet:icoArt('hide_helmet'),mat:icoArt('lumber')+icoArt('gravel'),animal:icoArt('rabbit')+icoArt('wolf'),altar:icoArt('altar'),tattoo:icoArt('tat_spiral'),setcard:icoArt('setcard'),crystal:icoArt('red_crystal'),gnosis:icoArt('gnosis'),parch:icoParch('p_bolt')}[p[0]]||'',KN[p[0]]||p[0]),(p[1]/pw*100).toFixed(0)+'%']}))+'<p class="note">Three decks: the <b>Neolithic Starter Pack</b> (the fixed tutorial kit), the <b>Neolithic Booster Pack</b> (10 random cards) and the <b>Neolithic Buff Pack</b> (25 random cards). Booster and Buff use the odds above. Packs are free in the beta.</p>');
  o+=sec('humans','Humans',
    '<div class="row">'+icoMan([])+icoMan(['spear','hide_armor'])+icoMan(['longbow','long_arrows'])+icoMan(['axe','hide_shield'])+'</div><p class="note">Every human starts with the same sheet. Gear, skill and sacrifices change it. Men and women are the same apart from the priestess role.</p>'+tbl(['Stat','Baseline','What it does','Raised by'],STATS.map(function(r){return[r[1]+' · '+r[2],typeof r[3]==='number'?(r[3]>=3600&&r[4]==='s'?infoDur(r[3]):(Math.round(r[3]*100)/100)+(r[4]?' '+r[4]:'')):r[3],r[5],r[6]?BOON[r[6]].n:'']}))+'<ul class="facts"><li>Up to 2 weapons, any number of quivers, 1 armor, 1 helmet and 1 shield. Equipping is permanent: nothing comes off once it is on. You name everyone.</li></ul>'+
    tbl(['Pace','Speed (yd/s)','Full endurance lasts','Time per open hex'],['creep','walk','jog','sprint'].map(function(k){return[k,PACE[k],infoDur(100/DRAIN[k]),mmss(HEX_YD/PACE[k])]}))+
    '<p class="note">At 0 endurance a man drops to a creep. A short rest takes 10 seconds and restores endurance to at least half.</p>');
  o+=sec('gear','Weapons and gear',tbl(['Item','Made of','Damage','Attacks per minute','Reach','Weight'],WLIST.map(function(k){var w=WEAP[k];return[nm(icoArt(k),CD[k].n),madeOf(k),w.dmg,w.apm,w.rng?w.reach+' yd range':w.reach+' yd',w.wt+' lb']}))+
    tbl(['Ammo','Made of','Fits','Per quiver','Weight'],[[nm(icoArt('short_arrows'),'Short arrows'),madeOf('short_arrows'),'Short bow','20','1 lb'],[nm(icoArt('long_arrows'),'Long arrows'),madeOf('long_arrows'),'Long bow','20','1.5 lb']])+
    tbl(['Item','Effect','Weight'],[[nm(icoArt('hide_armor'),'Hide armor'),'−5 damage per hit taken','12 lb'],[nm(icoArt('hide_helmet'),'Hide helmet'),'−'+HELM+' damage per hit taken (placeholder)','2 lb'],[nm(icoArt('hide_shield'),'Hide shield'),'−10 damage per hit taken','6 lb'],[nm(icoArt('arrows'),'Arrows'),'20 arrows per card. A bow needs them to shoot.','1 lb']])+
    '<p class="note">Every hit does at least 1 damage. Equipping any item costs 1 prestige. The battle axe takes both hands, so a man carrying one cannot carry a shield. Its numbers are placeholders.</p>');
  o+=sec('magic','Magic',
    '<ul class="facts"><li>Mana is the energy spent to cast. Every man starts with 1. A red crystal is consumed when used and adds 1 mana for good, with no limit.</li><li>Gnosis is the knowledge spent to learn. A gnosis card is consumed and gives 1 gnosis.</li><li>A spell parchment is consumed and teaches its spell for 1 gnosis plus 1 prestige. A man cannot learn the same spell twice.</li><li>Mana refills at the start of every fight and does not regenerate during one.</li><li>Fights default to AI combat: casters use spells on their own.</li></ul>'+
    tbl(['Spell','Cost to cast','Effect','How the AI uses it'],[[nm(icoSpell('p_jab'),'Arcane Jab'),'1 mana','−20 HP','enemy within 2 yd'],[nm(icoSpell('p_slash'),'Arcane Slash'),'1 mana','−10 HP, far range','enemy within 70 yd (placeholder range)'],[nm(icoSpell('p_bolt'),'Arcane Bolt'),'2 mana','−75 HP','first choice whenever he has 2 mana and an enemy within 70 yd (placeholder range)'],[nm(icoSpell('p_shield'),'Mystic Shield'),'1 mana','blocks the next 25 damage once','first, when an enemy is within 80 yd'],[nm(icoSpell('p_push'),'Gnostic Push'),'1 mana','−15 HP and shoves the target 10 yd away, 30 yd range','an enemy right on him (within 4 yd), or as a medium-range hit'],[nm(icoSpell('p_arrow'),'Arcane Arrow'),'1 mana','−25 HP, 150 yd range','enemies beyond 70 yd, out of reach of bows and Slash'],[nm(icoSpell('p_pull'),'Gnostic Pull'),'2 mana','drags one enemy out of his formation to within 2 yd of the caster, 40 yd range','a caster with a melee weapon, enemy 6 to 40 yd away']])+
    '<p class="note">Every Neolithic spell is <b>'+MAGIC_SCHOOL+'</b>. Schools and resonances arrive with later eras. Spells always hit and ignore armor and defense. Recharge: Jab 1 s, Slash, Push and Arcane Arrow 2 s, Mystic Shield, Bolt and Pull 3 s, times the caster\'s casting speed. All of these are placeholders.</p>');
  o+=sec('combat','Combat',
    '<ul class="facts"><li>Hit chance equals weapon skill: skill 10 hits 10% of the time.</li><li>Damage is the weapon\'s damage times strength, minus the target\'s overall defense (armor 5, helmet 3, shield 10), never below 1. Defense speed can dodge a hit outright.</li><li>Skill grows by 1 for every 10 attacks made with that weapon (placeholder). Drilling comes later with schools.</li><li>A unit spots mobs one tile away and reacts by its engagement criteria. A fight starts when it walks into a camp\'s hexes or meets a roaming party on the same tile. Enemies start about 90 yards away.</li><li>A field fight lasts 15 minutes at most. A raid on a settlement goes until one side is gone.</li></ul>'+
    tbl(['Playbook','How it works'],[['A move','Drawn on the map for the whole unit, one team or one man: a line of points anywhere, even inside a tile, walked at one pace. Dotted line creep, dashed walk, solid jog, zigzag sprint. The ground under the line sets the speed: woods and swamp slow, a road speeds up a unit marching in a file, deep water blocks.'],['The T','Where a move ends. Its orders run in order: rests, waits, a formation, hold here, lie in wait, return home, rejoin the unit.'],['When a move starts','Right after the move above (the default), at the start, or when any other move is done. A team or a man whose move comes up breaks off from the unit and walks his own line.'],['Battle plays','Drawn the same way on a blank 140 × 96 yard board, per unit. Right on the board is the way they were marching. Set a play to run against goblins, brigands or anyone, or pick it at contact.'],['Contact','The fight opens paused. Your men stand in their order of movement facing the way they marched, and wheel to face the enemy (up to 8 seconds) before they act.'],['Battle orders','Form, hold the line, defense posture, push forward, defense march, advance 5 to 20 yards, shoot till out of arrows or a count, cast a count of spells, draw knife, charge, fall back, lie in wait, wait, and wait until a move is done, the enemy is close, a team is out of arrows, or you press Spring it.'],['Stealth','A man creeping or lying in wait is hidden until an enemy comes within: woods 8 yd, thicket 6, brush 12, crops 18, mud 20, stream 22, open 35, road 40 (lying still: 60% of that). On the realm map a hidden unit is only met by a mob that walks within 60 yards of it, and the fight starts as an ambush. Every man has standard stealth for now.'],['Wait','Stay put for a set number of minutes.'],['Long rest','1 minute. Endurance comes back to full (times recovery).'],['Short rest','10 seconds. Endurance back to at least half.'],['Return home','Walk back to the unit\'s settlement.'],['Repeat','Run the whole patrol again every 10, 20, 30 or 60 minutes. The unit goes home first.'],['Defend settlement','A default patrol choice instead of a route. The unit stays home and attacks any mob that steps onto the settlement or one of the tiles touching it, then comes back.']])+
    tbl(['Engagement criteria','Choices'],Object.keys(ENG_LAB).map(function(k){return[ENG_LAB[k],ENG_OPT[k].map(function(o){return o[1]}).join(' · ')]})));
  o+=sec('field','Battlefields',
    '<ul class="facts"><li>When a unit meets mobs, the fight plays out right there on the map, on a '+BFW+' × '+BFH+' yard window of ground centred just ahead of the squad. Every 4 yards of it takes the painted ground under it, roads and streams included, so a fight near a tile edge runs on into the next tile and men can chase across it.</li><li>With Pause on contact on, the match stops and you set up: place each squad or team on the left side, give orders, then press Fight. With it off, the AI switches each squad to its default order of battle and the fight starts at once.</li><li>You can pause any time and change orders. Units that reinforce enter from the west edge.</li><li>A unit is a squad of one or more teams. Each unit has an order of movement and up to '+MAXOB+' orders of battle, set in the Patrols tab: a spot on a '+FMX+' × '+FMY+' grid ('+FMS+' yd squares) for every man, and in an order of battle a stance for every man.</li><li>A fight starts in the order of movement. Switch a squad to any of its orders of battle at any time. Squad orders (hold here, push forward, move to, fall back) move the whole formation. A team can break off with its own orders and rejoin with Formation.</li></ul>'+
    tbl(['Stance','What the man does'],Object.keys(STANCE).map(function(k){return[STANCE[k][0],STANCE[k][1]]}))+tbl(['Squad order','What the squad does'],Object.keys(SQO).map(function(k){return[SQO[k][0],SQO[k][1]]}))+tbl(['Team order','What the team does'],Object.keys(ORD).map(function(k){return[ORD[k][0],ORD[k][1]]}))+
    tbl(['Ground','Speed','Arrows from it','Arrows into it','Other'],Object.keys(GROUND).map(function(k){var g=GROUND[k];return g.mv?[nm(icoGround(k),g.n),'×'+g.mv,'×'+g.sh,'×'+g.cv,g.ml?g.ml+' melee skill':g.ln?'+'+g.ln+' melee skill holding a line':'']:[nm(icoGround(k),g.n),'blocks','','','']}))+
    tbl(['Tile','Battlefield'],[['Woodland','mostly trees with a few clearings and brush'],['Swamp','mud patches, deep pools, reeds'],['Pond','open water in the middle, muddy banks'],['Open field','open ground, some brush and a tree clump or two'],['Pasture','open ground, a few trees, sheep'],['Cultivated','rows of crops'],['Settlement','open ground and huts']])+
    '<p class="note">Archers shoot only when standing still. All ground numbers are placeholders.</p>');
  o+=sec('altar','Women, altars and sacrifice',
    '<div class="row">'+icoWrap(humanInner([],true,{id:7}),16,34)+icoArt('altar')+['rabbit','stag','boar','wolf','hawk'].map(icoArt).join('')+'</div>'+
    '<ul class="facts"><li>About 1 human card in 20 is a woman (placeholder). Women do not join units, carry arms or fight in raids. A woman serves at a shrine: she can only be assigned to a settlement with an altar, where she can become its priestess. Crystals, gnosis, spells and tattoos still work on her.</li><li>An altar is a rare pack card. It goes in a hamlet or village, never a military camp, one per settlement, and costs '+ALTAR_COST+' prestige to place.</li><li>An altar needs a priestess, a woman living in that settlement.</li><li>A sacrifice is offered for one person living there, who gains a random boost. It costs '+SAC_COST+' prestige, the animal, one more person from that settlement (never the priestess), and goods the altar asks for. The goods depend on the animal and are drawn at random from its list, then stay the same until paid.</li><li>Goods by animal: '+Object.keys(SAC_GOODS).map(function(k){return BOON[k].n+': '+SAC_GOODS[k].map(matsText).join(' or ')}).join('; ')+'.</li><li>A person can carry one kind of animal. More of the same kind add up.</li><li>Sacrifices happen at home, between matches.</li></ul>'+
    tbl(['Animal','Gift','Boost','What it affects'],Object.keys(BOON).map(function(k){var B=BOON[k];return[nm(icoArt(k),B.n),B.a,'+'+B.lo+' to '+B.hi+'%',B.t]}))+
    '<p class="note">Charges and flanking runs on the battlefield go at a sprint while a man has endurance, so the rabbit matters there. All numbers are placeholders.</p>');
  o+=sec('mobs','Mobs',tbl(['Camp','Needs','Mobs','HP','Speed','Weapons','Reward'],[
    [nm(icoMob('goblin'),'Small goblin camp'),'10 contiguous swamp hexes','10 to 15 goblins','50',GOB_SP+' yd/s, twice a human sprint','15 damage, 60 attacks per minute','100 prestige + loot for the mobs, 100 + more loot for burning the camp'],
